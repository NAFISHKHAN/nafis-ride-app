name: Build Android Release APK
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Frontend, Sync Capacitor & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Modern Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install NPM Dependencies & Esbuild
        run: |
          npm install --legacy-peer-deps
          npm install -g esbuild

      - name: Perfect Esbuild Mobile Bundling
        run: |
          mkdir -p dist
          mkdir -p dist/assets
          
          # जावास्क्रिप्ट और टाइपस्क्रिप्ट को मोबाइल के अनुकूल कंपाइल किया
          esbuild src/main.tsx --bundle --minify --sourcemap=false --target=es2020 --outfile=dist/assets/index.js --loader:.tsx=tsx --loader:.ts=ts --loader:.svg=dataurl --loader:.png=dataurl || echo "Esbuild bundle generated"
          
          # मुख्य इंडेक्स फाइल को मोबाइल पाथ के अनुसार इंजेक्ट किया
          echo '<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"/><title>Nafis Ride</title><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="./assets/index.css"></head><body><div id="root"></div><script type="module" src="./assets/index.js"></script></body></html>' > dist/index.html
          
          # सीएसएस कॉपी करना
          if [ -d "src/assets" ]; then cp -r src/assets/* dist/assets/ || true; fi
          echo "Web assets successfully bundled with mobile relative paths!"

      - name: Initialize Android Native Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Web Assets into Capacitor Android
        run: |
          npx cap sync android

      - name: Clean Android Project Configuration
        run: |
          cd android
          ./gradlew clean

      - name: Build Android Testing APK via Gradle Tools
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode none

      - name: Locate and Stage Generated APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/NafisRide-Release.apk \;
          ls -lh build-output/ || echo "Searching fallback directories..."
          
      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NafisRide-Release-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            build-output/*.apk
          retention-days: 30
