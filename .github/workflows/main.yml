name: Build Android Release APK
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Frontend, Sync Capacitor & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Modern Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Direct Compile Assets (Master White Screen Fix)
        run: |
          # package.json की गड़बड़ी को बायपास करके सीधे Vite से एसेट्स बिल्ड किया
          npx vite build --base ./
        env:
          NODE_ENV: production

      - name: Initialize Android Native Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Web Assets into Capacitor Android
        run: |
          npx cap sync android

      - name: Clean Android Project Configuration
        run: |
          cd android
          ./gradlew clean

      - name: Build Android Testing APK via Gradle Tools
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode none

      - name: Locate and Stage Generated APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/NafisRide-Release.apk \;
          ls -lh build-output/ || echo "Searching fallback directories..."
          
      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NafisRide-Release-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            build-output/*.apk
          retention-days: 30
